[workspace]
members = [
    "crates/aloepri-cli",
    "crates/aloepri-core",
    "crates/aloepri-artifact",
    "crates/aloepri-architecture",
    "crates/aloepri-transform",
    "crates/aloepri-secret",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
authors = ["AloePri contributors"]

[workspace.dependencies]
aloepri-core = { path = "crates/aloepri-core" }
aloepri-artifact = { path = "crates/aloepri-artifact" }
aloepri-architecture = { path = "crates/aloepri-architecture" }
aloepri-transform = { path = "crates/aloepri-transform" }
aloepri-secret = { path = "crates/aloepri-secret" }
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4.3"
nalgebra = "=0.34.1"
rand = "=0.9.2"
rand_chacha = "=0.9.0"
rand_distr = "=0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
